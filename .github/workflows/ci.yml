name: Frontend CI/CD Pipeline - Quality & Build Verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Angular Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-msal/package-lock.json

      - name: Install dependencies
        working-directory: frontend-msal
        run: npm ci

      - name: Build Angular Application
        working-directory: frontend-msal
        run: npm run build
